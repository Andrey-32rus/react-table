name: Deploy Next.js app to server

on:
  push:
    branches:
      - master  # Пуш в основную ветку (или любую другую ветку, которую вы хотите использовать для деплоя)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '22'  # Убедитесь, что версия Node.js соответствует вашей

    - name: Install dependencies
      run: |
        npm install --production

    - name: Build the app
      run: |
        npm run build

    - name: Deploy to server
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SERVER_IP: ${{ secrets.SERVER_IP }}
        USER: ${{ secrets.USER }}
      run: |
        echo "$SSH_PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem
        ssh -o StrictHostKeyChecking=no -i private_key.pem $USER@$SERVER_IP << 'EOF'
          cd /путь/к/проекту
          git pull origin master  # Пулл последних изменений (если используете git на сервере)
          npm install --production           # Установка зависимостей
          npm run build         # Сборка проекта
          pm2 restart next-app  # Перезапуск приложения через pm2 (если используется pm2)
        EOF
