name: Deploy Next.js app to server

on:
  push:
    branches:
      - master  # Пуш в основную ветку (или любую другую ветку, которую вы хотите использовать для деплоя)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22'  # Убедитесь, что версия Node.js соответствует вашей

      - name: Install dependencies
        run: |
          npm install --production

      - name: Upload packages to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          USER: ${{ secrets.USER }}
        run: |
          # Подготовка SSH ключа
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts  # Добавляем github в список доверенных хостов
          
          # Подключение по SSH и деплой
          ssh -i private_key.pem -p 22220 $USER@$SERVER_IP << 'EOF'
            cd /var/react-table
          
            # Выполнение git pull с проверкой на ошибку
            git pull origin master || { echo 'Git pull failed: Permission denied (publickey)'; exit 1; }
          
            npm install --production  # Установка зависимостей
            rm -rf .next  # Удаляем старые файлы из .next
          EOF

      - name: Copy build artifacts to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          USER: ${{ secrets.USER }}
        run: |
          # Копирование артефактов билда на сервер
          scp -i private_key.pem -P 22220 -r .next $USER@$SERVER_IP:/var/react-table

      - name: Restart pm2 process
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          USER: ${{ secrets.USER }}
        run: |
          # Подготовка SSH ключа
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts  # Добавляем github в список доверенных хостов
          
          # Перезапуск приложения через pm2
          ssh -i private_key.pem -p 22220 $USER@$SERVER_IP << 'EOF'
            pm2 restart react-table  # Перезапуск приложения
          EOF